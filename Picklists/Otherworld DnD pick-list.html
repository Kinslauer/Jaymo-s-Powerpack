ws": [{"id": "oa-affix", "t": "Random affixes on found gear", "s": "M", "on": false, "d": ["Gear found in the world (dungeons, loot chests, mob drops) rolls random affixes: +damage, +speed, +resistance, etc. Affixes are rolled from a pool, with a rarity tier (common, uncommon, rare, epic, legendary)."], "f": "we already have FoundQuality (Kingdoms, from Apotheosis's idea) which rolls a quality from where gear was found. This would extend that to full random affixes with a rarity system.", "note": ""}, {"id": "oa-reforge", "t": "Reforge bench: reroll affixes", "s": "M", "on": false, "d": ["A workbench that lets you reroll a piece of gear's affixes, spending an ingot. Each reroll is random; you can lock one affix."], "f": "a new workbench in the Armory or a Kingdoms smithy. We have BandForge for the xeno band reforge — this would be a general-purpose reforge for any gear.", "note": ""}, {"id": "oa-salvage", "t": "Salvage gear for materials", "s": "S", "on": false, "d": ["Breaking a piece of gear down at a smith returns its base materials plus a small bonus."], "f": "we already have GearSalvage (Kingdoms, from Apotheosis's idea). This is already ours.", "note": "already ours"}, {"id": "oa-tiers", "t": "World tiers: mob scaling by distance", "s": "M", "on": false, "d": ["Mobs further from the world spawn point are stronger and drop better loot. The tier is based on distance from the origin."], "f": "we already have WorldTiers (Kingdoms, from Apotheosis's idea). This is already ours.", "note": "already ours"}], "opts": []}, {"kind": "rows", "head": "Luki's Grand Capitals — capital village structures", "level": 2, "part": "Luki's Grand Capitals — capital village structures", "text": ["`ideas only` · All Rights Reserved · Forge/Fabric 1.19–1.21 (by lukidon)"], "rows": [{"id": "lc-capitals", "t": "Grand capital villages with district layout", "s": "L", "on": false, "d": ["Large village structures with a clear district layout: market, temple, barracks, homes, a well, and a c s)."], "rows": [], "opts": []}], "file": "Otherworld DnD pick-list.md", "key": "pick-page:Otherworld DnD pick-list:2026-11-26"}</script>

  ta.oninput=()=>{S.note=ta.value;keep();};c.appendChild(ta);if(!term&&!only)m.appendChild(c);count();}
function text(){const L=['PICKS v1 · '+P.file,''];
  P.blocks.forEach(b=>{b.rows.forEach(r=>{const s=S.rows[r.id];if(s&&(s.on||s.note)){L.push('['+(s.on?'x':' ')+'] '+r.id+' · '+r.t);if(s.note)L.push('    note: '+s.note.replace(/\s+/g,' '));}});
    if(b.kind==='question'){const a=S.answers[b.id]||{};const opt=a.opt||((b.opts.find(o=>o.chosen)||b.opts.find(o=>o.suggested)||{}).id);
      if(opt){const o=b.opts.find(x=>x.id===opt);L.push('Q '+b.id+' = '+opt+' · '+(o?o.t:''));if(a.note)L.push('    note: '+a.note.replace(/\s+/g,' '));}}});
  if(S.note)L.push('NOTE: '+S.note.replace(/\s+/g,' '));return L.join('\n')+'\n';}
$('copy').onclick=()=>{const t=text();const o=$('out');o.value=t;const fb=()=>{o.style.display='block';o.focus();o.select();$('msg').textContent='Copy the text below (Ctrl+C) and paste it to the assistant.';};
  try{navigator.clipboard.writeText(t).then(()=>{$('msg').textContent='Copied. Paste it to the assistant.';},fb);}catch(e){fb();}};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text()],{type:'text/plain'}));
  a.download=P.file.replace(/\.md$/,'')+'.picks.txt';document.body.appendChild(a);a.click();a.remove();
  $('msg').textContent='Saved as '+a.download+' in your Downloads. Tell the assistant it is there.';};
$('q').oninput=render;
$('only').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));b.textContent=b.getAttribute('aria-pressed')==='true'?'Show all':'Show ticked only';render();};
render();
})();
</script></body></html>
