plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive on the home PC (its syncing locks files and breaks rebuilds); elsewhere
// (a cloud session) the usual build/ folder
if (file("E:/").exists()) {
	layout.buildDirectory = file("E:/jaymos-kingdoms-build")
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
	// dev games read commands.txt in the run folder (DevCommands), so a test can drive them from outside
	runs {
		configureEach { vmArg "-Djaymoskingdoms.devCommands=true" }
		// the test game kept small: the PC it runs on is short of memory
		client { vmArg "-Xmx2560M" }
	}
	mods {
		"jaymoskingdoms" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Epic Structures: Villages (all rights reserved; "feel free to add to any modpack"): its sprawling towns are where
	// kingdoms rise in the pack. Only loaded in the dev game, to found kingdoms in them.
	localRuntime "maven.modrinth:epic-structures-villages:hCRa4eFr"
	// Better Combat (and Player Animation Library, which it needs) are optional: MobCombat gives humanoid mobs its weapon
	// moves when it's loaded. Compiled against, in the dev game, never required (the same versions as Powers' pack).
	compileOnly "maven.modrinth:better-combat:8Vyq1h9a"
	compileOnly "maven.modrinth:player-animation-library:xJ30QmpE"
	localRuntime "maven.modrinth:better-combat:8Vyq1h9a"
	localRuntime "maven.modrinth:player-animation-library:xJ30QmpE"
	localRuntime "maven.modrinth:cloth-config:26.3.158+fabric"
	// Entity Model Features (LGPL; EmfWornPose): our worn models (Armory pieces, wizard hats) take the body's Fresh
	// Animations pose from it when it's loaded. Compiled against (the same versions as Powers' pack), never required.
	compileOnly "maven.modrinth:entity-model-features:N7d5LddE"
	compileOnly "maven.modrinth:entitytexturefeatures:O8J3sxxp"
	// Cooking for Blockheads (and Balm, which it needs): its fruit baskets and tool racks are displays (Displays), looked
	// up by name only; in the dev game to see them (the same versions as Powers' pack)
	localRuntime "maven.modrinth:balm:26.3.0.3+fabric-26.3"
	localRuntime "maven.modrinth:cooking-for-blockheads:26.3.0.2+fabric-26.3"
	// Minecraft Comes Alive (GPL-3.0; McaCompat, McaBridge and the MCA mixins): compiled against the pack's jar in ../libs,
	// never required
	compileOnly fileTree("../libs") { include "mca-fabric-*.jar" }
	// and in the dev game, to see its villagers in the test world
	localRuntime fileTree("../libs") { include "mca-fabric-*.jar" }
	// Balkon's WeaponMod: Legacy (MIT; WeaponModJavelins): guards throw its javelins when it's loaded. Compiled against the
	// pack's version, in the dev game (with Architectury, which it needs), never required
	compileOnly "maven.modrinth:balkons-weaponmod-legacy:Fabric-26.3-1.25.1"
	localRuntime "maven.modrinth:balkons-weaponmod-legacy:Fabric-26.3-1.25.1"
	compileOnly "maven.modrinth:architectury-api:22.0.4+fabric"
	localRuntime "maven.modrinth:architectury-api:22.0.4+fabric"
	// Jade (CC BY-NC-SA 4.0, Snownee; in Powers' pack): client/compat/JadeIntroductions keeps strangers' names, trades and
	// health off its panel. Compiled against (the same version as Powers' pack), never required.
	compileOnly "maven.modrinth:jade:71CTWqdE"
	// Simple Voice Voice Changer (CC BY-NC-SA 4.0, sawiq; in Powers' pack): client/VoiceChangerCompat turns a player's
	// voice for a werewolf, a Great Ape or a disguise (VoiceMasks) through its API. Compiled against, never required.
	compileOnly "maven.modrinth:simple-voice-voice-changer:acFxvUQp"
	// Epic Knights (KnightsCompat) is looked up by registry id only: no build for 26.3 yet, so nothing to compile against.
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
