# Runs on every pull request to master. A red check means: don't merge yet, read the failing step's log.
# What it checks and why: docs/AI-HANDBOOK.md, "Before you open a PR".
name: PR checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Versions, libs jars, item models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/pr_checks.py origin/${{ github.base_ref }}

  build:
    name: Build ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: Powers
            dir: .
          - mod: Kingdoms
            dir: kingdoms
          - mod: Kitchen
            dir: kitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: sh ./gradlew build --no-daemon --stacktrace
