plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive on the home PC (its syncing locks files and breaks rebuilds); elsewhere
// (a cloud session) the usual build/ folder
if (file("E:/").exists()) {
	// one folder per checkout (the repo folder's name), so a bot's worktree build and the main checkout's deploy
	// never clean each other's outputs ("Failed to clean up stale outputs", 2026-11-09)
	layout.buildDirectory = file("E:/jaymos-kitchen-build/${projectDir.parentFile.name.replace(' ', '-')}")
}

repositories {
	mavenCentral()
	// Cooking for Blockheads and Balm (required alongside this mod; not bundled)
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jaymoskitchen" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:balm:26.3.0.3+fabric-26.3"
	implementation "maven.modrinth:cooking-for-blockheads:26.3.0.2+fabric-26.3"
	// GeckoLib (MIT, Tslat and contributors): the skeletons on bone stands (butchery/Skeletons), drawn from Blockbench
	// models. The same file the pack ships (root build.gradle, Kingdoms), 5.5.7.
	implementation "maven.modrinth:geckolib:kSxHvs99"
	// (0.4.41) compiled against for the mill's recipe pages; touched only via client/jei (its jei_mod_plugin entrypoint)
	compileOnly "maven.modrinth:jei:QfoQJyPO"
	// (0.4.44) Minecraft Comes Alive (GPL-3.0): a dead player's villager look (client/corpse/McaLooks), touched only when
	// it's loaded; compiled against the pack's jar in ../libs
	compileOnly fileTree("../libs") { include "mca-fabric-*.jar" }
}

def langParts = file("src/main/resources/assets/jaymoskitchen/lang/parts")
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
	// new features' lang keys go in small part files, lang/parts/*.json; they're merged into en_us.json here
	exclude "assets/jaymoskitchen/lang/parts/**"
	inputs.dir langParts
	doLast {
		def out = new File(destinationDir, "assets/jaymoskitchen/lang/en_us.json")
		def merged = new TreeMap(new groovy.json.JsonSlurper().parse(out, "UTF-8"))
		(langParts.listFiles() ?: new File[0]).findAll { it.name.endsWith(".json") }.sort { it.name }.each { part ->
			new groovy.json.JsonSlurper().parse(part, "UTF-8").each { k, v ->
				if (merged.containsKey(k) && merged[k] != v) {
					throw new GradleException("lang key ${k} is defined twice (again in ${part.name})")
				}
				merged[k] = v
			}
		}
		out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), "UTF-8")
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The pack's licence notice (LICENSE at the repo root) ships in the jar as LICENSE_jaymos.
jar {
	from(file("../LICENSE")) { rename { "LICENSE_jaymos" } }
}
