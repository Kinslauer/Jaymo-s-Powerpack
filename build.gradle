import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive (its syncing locks files and breaks rebuilds);
// one folder per checkout, so parallel worktrees don't share a build dir
layout.buildDirectory = file("E:/jaymospowers-build/${rootDir.name.replace(' ', '-')}")

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jaymospowers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		server { vmArg "-Xmx1536M" }
	}
}

// The rest of the modpack, with each mod's CurseForge [project id, file id] for the CurseForge import zip.
// Keep the versions in step with the CurseForge files (Cloth Config's newest Fabric file there is 26.3.158).
def packMods = [
	[dep: "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}", cf: [306612, 9078180]],
	[dep: "maven.modrinth:balm:26.3.0.3+fabric-26.3", cf: [531761, 9035245]],
	[dep: "maven.modrinth:cooking-for-blockheads:26.3.0.2+fabric-26.3", cf: [231484, 9035244]],
	// Balkon's WeaponMod: Legacy (MIT): the Pocket Arsenal pulls its weapons from the registry, so no compile dependency
	[dep: "maven.modrinth:balkons-weaponmod-legacy:Fabric-26.3-1.25.1", cf: [1033985, 8893149]],
	[dep: "maven.modrinth:architectury-api:22.0.4+fabric", cf: [419699, 9075717]],
	[dep: "maven.modrinth:cloth-config:26.3.158+fabric", cf: [348521, 8884063]],
	// Better Combat (animated weapon swings and combos; its fallback rules cover Balkon's weapons by name) and its library
	[dep: "maven.modrinth:better-combat:8Vyq1h9a", cf: [639842, 8906536]],
	[dep: "maven.modrinth:player-animation-library:xJ30QmpE", cf: [1283899, 9080979]],
	// the extras from the friends' server (Modrinth version ids, matched by file hash)
	[dep: "maven.modrinth:pantry-for-blockheads:JsGFynFi", cf: [1514716, 8893586]],
	[dep: "maven.modrinth:natures-compass:pHan4UQ9", cf: [252848, 8916820]],
	[dep: "maven.modrinth:jei:QfoQJyPO", cf: [238222, 9068072]],
	[dep: "maven.modrinth:mezzconfig:GKiA7PV4", cf: [1689768, 9048674]],
	[dep: "maven.modrinth:xaeros-minimap:B2aG1aya", cf: [263420, 9067206]],
	[dep: "maven.modrinth:sodium:bAZQdGpg", cf: [394468, 8888037]],
	[dep: "maven.modrinth:ok-zoomer:3UXOK2JF", cf: [354047, 8899781]],
]
// not on CurseForge: shipped inside the pack as overrides
def kitchenJar = fileTree("libs") { include "jaymos-kitchen-*.jar" }

configurations {
	packJars {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// the rest of the modpack, loaded in the dev game only (fabric-api is already on the classpath)
	localRuntime kitchenJar
	packMods.drop(1).each { localRuntime it.dep }
	packMods.each { packJars it.dep }
}

// gradlew packageModpack:
//   modpack/mods/                          every jar, for the server or a hand-made profile
//   modpack/Jaymos-Powers-Modpack-<v>.zip  CurseForge import (Create Custom Profile → Import); it downloads the rest itself
def packDir = file("modpack")
tasks.register("modpackMods", Sync) {
	from configurations.packJars
	from tasks.named("jar")
	from kitchenJar
	into new File(packDir, "mods")
}
tasks.register("curseforgeManifest") {
	def out = layout.buildDirectory.file("modpack/manifest.json")
	outputs.file out
	doLast {
		def manifest = [
			minecraft      : [version: project.minecraft_version, modLoaders: [[id: "fabric-${project.loader_version}", primary: true]]],
			manifestType   : "minecraftModpack",
			manifestVersion: 1,
			name           : "Jaymo's Powers",
			version        : project.version,
			author         : "Manigraphic78",
			files          : packMods.collect { [projectID: it.cf[0], fileID: it.cf[1], required: true] },
			overrides      : "overrides",
		]
		out.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
	}
}
tasks.register("curseforgePack", Zip) {
	dependsOn "curseforgeManifest"
	archiveFileName = "Jaymos-Powers-Modpack-${project.version}.zip"
	destinationDirectory = packDir
	from(layout.buildDirectory.file("modpack/manifest.json"))
	into("overrides/mods") {
		from tasks.named("jar")
		from kitchenJar
	}
}
// the friends' server (Serverfiles/, not in git): its mods folder is kept identical to the pack
def serverDir = file("Serverfiles")
tasks.register("serverMods", Sync) {
	onlyIf { serverDir.isDirectory() }
	from configurations.packJars
	from tasks.named("jar")
	from kitchenJar
	into new File(serverDir, "mods")
}
tasks.register("packageModpack") {
	group = "build"
	dependsOn "modpackMods", "curseforgePack", "serverMods"
}

// each power keeps its own lang file in lang/parts/<power>.json; they're merged into en_us.json here
def langParts = file("src/main/resources/assets/jaymospowers/lang/parts")
processResources {
	def version = project.version
	inputs.property "version", version
	inputs.dir langParts
	filesMatching("fabric.mod.json") { expand "version": version }
	exclude "assets/jaymospowers/lang/parts/**"
	doLast {
		def merged = new TreeMap()
		langParts.listFiles().findAll { it.name.endsWith(".json") }.sort { it.name }.each { part ->
			def entries = new JsonSlurper().parse(part, "UTF-8")
			entries.each { k, v ->
				if (merged.containsKey(k) && merged[k] != v) {
					throw new GradleException("lang key ${k} is defined twice (again in ${part.name})")
				}
				merged[k] = v
			}
		}
		def out = new File(destinationDir, "assets/jaymospowers/lang/en_us.json")
		out.parentFile.mkdirs()
		out.setText(JsonOutput.prettyPrint(JsonOutput.toJson(merged)), "UTF-8")
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = "UTF-8" }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
