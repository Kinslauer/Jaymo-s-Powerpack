import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive (its syncing locks files and breaks rebuilds);
// one folder per checkout, so parallel worktrees don't share a build dir
if (file("E:/").exists()) {
	layout.buildDirectory = file("E:/jaymospowers-build/${rootDir.name.replace(' ', '-')}")
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
	// CurseForge files by project and file id, for mods that are only on CurseForge
	exclusiveContent {
		forRepository { maven { url = "https://cursemaven.com" } }
		filter { includeGroup "curse.maven" }
	}
	// MixinSquared (MIT, Bawnorton): lets compat/mixin/lithostitched reach into Lithostitched's own mixin
	exclusiveContent {
		forRepository { maven { url = "https://maven.bawnorton.com/releases" } }
		forRepository { maven { url = "https://maven.enjarai.dev/mirrors" } }
		filter { includeGroup "com.github.bawnorton.mixinsquared" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jaymospowers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		server { vmArg "-Xmx1536M" }
	}
}

