	// (OmniCrossbows). Client and server; needs Fabric Language Kotlin 2.4.20+ (packMods has 1.14.2+kotlin.2.4.21) and
	// carries its own Kaleido Config.
	// Pinned by its Modrinth version number (modrinth.com/mod/omnicrossbow/version/1.1.4+mc26.3, project TxqFWfQR), as
	// Cloth Config and Balm are. TODO(home PC): move it to packMods if it has a CurseForge file.
	[dep: "maven.modrinth:omnicrossbow:1.1.4+mc26.3"],
]
// not on CurseForge: shipped inside the pack as overrides
def kitchenJar = fileTree("libs") { include "jaymos-kitchen-*.jar" }
// Minecraft Comes Alive (GPL-3.0, by Luke100000 and team): human villagers to befriend, marry and raise children with,
// village ranks up to monarch. Its newest CurseForge/Modrinth file is for 26.2, so until a 26.3 one comes out the pack
// ships a jar built from the authors' own 26.3 branch (github.com/Luke100000/minecraft-comes-alive, dev/26.3 at
// 3badc42; the source is there, as the GPL asks), as an override like Kitchen. Jaymo's Kingdoms ties into it (McaCompat).
// TODO: once CurseForge project 535291 has a Fabric 26.3 file, move it into packMods and delete the jar from libs/.
def mcaJar = fileTree("libs") { include "mca-fabric-*.jar" }
// Jaymo's Kingdoms (kingdoms/, its own Gradle project): built by the pack tasks, then shipped as an override like Kitchen.
// Its build output goes where kingdoms/build.gradle puts it (E:\ on the home PC).
def kingdomsProps = new Properties()
file("kingdoms/gradle.properties").withInputStream { kingdomsProps.load(it) }
tasks.register("buildKingdoms", GradleBuild) {
	dir = file("kingdoms")
	tasks = ["build"]
}
def kingdomsLibs = file(file("E:/").exists() ? "E:/jaymos-kingdoms-build/libs" : "kingdoms/build/libs")
def kingdomsJar = fileTree(kingdomsLibs) { include "jaymos-kingdoms-${kingdomsProps.version}.jar" }.builtBy("buildKingdoms")
// The Roads More Travelled (CC BY-NC 4.0, by milkucha; github.com/milkucha/trmt): paths wear into grass, dirt and sand
// where people and mounts walk most, and grow back when left alone. It has no 26.3 build, so ports/trmt is its 26.1.x
// source ported to 26.3 (changes listed in ports/trmt/PORT.md, credit kept), built by the pack tasks and shipped as an
// override like Kingdoms. Free pack, so the non-commercial licence holds. TODO: once milkucha releases for 26.3
// (Modrinth 74oZhrEe, CurseForge 1512955), move it into packMods and delete ports/trmt.
def trmtProps = new Properties()
file("ports/trmt/gradle.properties").withInputStream { trmtProps.load(it) }
tasks.register("buildTrmt", GradleBuild) {
	dir = file("ports/trmt")
	tasks = ["build"]
}
def trmtLibs = file(file("E:/").exists() ? "E:/trmt-port-build/libs" : "ports/trmt/build/libs")
def trmtJar = fileTree(trmtLibs) { include "trmt-${trmtProps.mod_version}.jar" }.builtBy("buildTrmt")
// on CurseForge but not on a maven we use: the jar sits in libs/ (git-ignored, copied from the Jaymo's Kitchen
// profile) and the CurseForge import downloads it by id. Not loaded in the dev game (too heavy for quick tests).
def localPackMods = [
	// (none right now; Distant Horizons was here until 0.4.5)
]
// resource packs, client-only: the CurseForge import downloads them into resourcepacks/ by id, and Jaymo's Powers
// switches each on once per install (client/PackResourcePacks). The CurseForge files are all rights reserved, so they
// are never copied into the pack; Build Modpack downloads them into your own profile from CurseForge's CDN.
def packResourcePacks = [
	// MCA - Default Medieval (by DE4THR4SH): vanilla-style medieval clothes, faces and hair for MCA's villagers. Its
	// newest file says 1.21.1, but it only retextures MCA's skins, and 1144 of our 26.3 MCA jar's 1145 skin files are
	// at the same paths (the last one is MCA's own folder icon).
	[cf: [667175, 8868890], file: "MCAR_VanillaMedieval_Universal_7.7.36-beta.3+1.21.1.zip"],
	// Fresh Animations: Player Extension (by FreshLX; modpacks may include it, never redistribute it): livelier player
	// animations through Entity Model Features. Stands alone, no base Fresh Animations needed; supports up to 26.3.
	[cf: [1281029, 8245230], file: "FA+Player-v1.1.zip"],
	// Canoe Boats (by CanineGray; CC BY-NC 4.0, shipped unchanged, credit to its author): every boat becomes a canoe,
	// through Entity Model Features and Entity Texture Features (both already in the pack). Made for 26.3.
	[cf: [1086847, 8944107], file: "Canoe boats 26.3.zip"],
]
// shader packs, client-only: the CurseForge import downloads them into shaderpacks/ by id, and Jaymo's Powers chooses
// and switches on Complementary Unbound in Iris once per install (client/ShaderPreset).
def packShaderPacks = [
	// Complementary Unbound (by EminGT, Complementary Development; Complementary License Agreement): modpacks may include
	// it unchanged, added through CurseForge's own system, and must credit it on the pack's description page since it's
	// on by default. Never copied into the pack or changed, settings included. r5.9.3 is made for 26.2 and 26.3 (Iris).
	[cf: [385587, 8884656], file: "ComplementaryUnbound_r5.9.3.zip"],
]
// mods taken out of the pack: moved out of your CurseForge profile's mods folder (into removed-mods) on the next build
// (Towns and Towers left in 0.8.4: its villages fought Epic Structures: Villages, where kingdoms are founded; its
// library Cristel Lib came back in 0.8.69 for Overhauled Overworld. Traveler's Backpack left in 0.8.14, and Forge
// Config API Port with it until TaCZ brought it back in 0.10.43)
// (Chunky left in 0.8.118, wrongly blamed for a new world hanging at "Selecting global world spawn" with Distant
// Horizons on the server; back in 0.10.51)
def removedFromProfile = ["t_and_t-", "towns-and-towers-", "travelersbackpack-", "alexs-mobs-", "citadel-"]
// the same, by Fabric mod id, for mods whose CurseForge file names we don't know: Alex's Mobs and Citadel (0.8.107,
// their models drew black slabs and streaks across the screen with Iris shaders), Distant Horizons (0.9.6, taken out
// at Andy's request; a new world on the Deck's server had hung at startup with it), Camera Utils (0.10.57, Shoulder
// Surfing Reloaded won't load beside it), Combat Roll (0.15.16: it left the pack in 0.15.5 for our own feathers and
// dodge, but stayed in the profile and still drew its roll arrows and key hint beside the hotbar)
def removedIdsFromProfile = ["alexsmobs", "citadel", "distanthorizons", "camerautils", "combat_roll"]
// a jar's fabric.mod.json (null if it isn't a Fabric mod): the profile's CurseForge file names differ from the pack's
def modJson = { File jar ->
	try {
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			def entry = zip.getEntry("fabric.mod.json")
			entry == null ? null : new JsonSlurper().parse(zip.getInputStream(entry))
		}
	} catch (IOException ignored) {
		null
	}
}
def modId = { File jar ->
	def json = modJson(jar)
	json == null ? null : json.id
}
def localPackJars = files(localPackMods.collect { it.file })


configurations {
	packJars {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
	packOverrideJars {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// the rest of the modpack, loaded in the dev game only (fabric-api is already on the classpath)
	localRuntime kitchenJar
	localRuntime mcaJar
	// compiled against (for its corpses); required at runtime since 0.8 (fabric.mod.json), touched only via power/web/KitchenCompat
	compileOnly kitchenJar
	// compiled against to read Better Combat's attack swings while flying; touched only via client/power/wind/PalAccess
	compileOnly "maven.modrinth:player-animation-library:xJ30QmpE"
	// compiled against to make its swings hit bodies, not boxes; touched only via client/compat/mixin/LimbSwingMixin
	compileOnly "maven.modrinth:better-combat:8Vyq1h9a"
	// compiled against to pause Fresh Animations' player animations under our poses; touched only via client/EmfAccess
	compileOnly "maven.modrinth:entity-model-features:vF6qLXsA"
	compileOnly "maven.modrinth:entitytexturefeatures:OOEycXyN"
	// (0.11.31) compiled against for its recipe pages; touched only via client/jei (its jei_mod_plugin entrypoint)
	compileOnly "maven.modrinth:jei:wQJNj1C5"
	// (0.15.47) compiled against to keep its panel off blocks; touched only via client/compat/JadeEntitiesOnly (its jade entrypoint)
	compileOnly "maven.modrinth:jade:71CTWqdE"
	packMods.drop(1).findAll { it.dev != false }.each { localRuntime it.dep }
	packMods.each { packJars it.dep }
	packModsNoCf.each { localRuntime it.dep; packJars it.dep }
	packModsOverride.each { packJars it.dep; packOverrideJars it.dep }
}

// gradlew packageModpack:
//   modpack/mods/                          every jar, for the server or a hand-made profile
//   modpack/Jaymos-Powers-Modpack-<v>.zip  CurseForge import (Create Custom Profile → Import); it downloads the rest itself
def packDir = file("modpack")
tasks.register("modpackMods", Sync) {
	from configurations.packJars
	from tasks.named("jar")
	from kitchenJar
	from mcaJar
	from kingdomsJar
	from trmtJar
	from localPackJars
	into new File(packDir, "mods")
}
tasks.register("curseforgeManifest") {
	def out = layout.buildDirectory.file("modpack/manifest.json")
	outputs.file out
	doLast {
		def manifest = [
			minecraft      : [version: project.minecraft_version, modLoaders: [[id: "fabric-${project.loader_version}", primary: true]]],
			manifestType   : "minecraftModpack",
			manifestVersion: 1,
			name           : "Jaymo's Powers",
			version        : project.version,
			author         : "Manigraphic78",
			files          : (packMods + localPackMods + packResourcePacks + packShaderPacks).collect { [projectID: it.cf[0], fileID: it.cf[1], required: true] },
			overrides      : "overrides",
		]
		out.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
	}
}
tasks.register("curseforgePack", Zip) {
	dependsOn "curseforgeManifest"
	archiveFileName = "Jaymos-Powers-Modpack-${project.version}.zip"
	destinationDirectory = packDir
	from(layout.buildDirectory.file("modpack/manifest.json"))
	into("overrides/mods") {
		from configurations.packOverrideJars
		from tasks.named("jar")
		from kitchenJar
		from mcaJar
		from kingdomsJar
		from trmtJar
	}
}
// the friends' server (Desktop\Serverfiles): its mods folder is kept identical to the pack, but never while it's
// running (Windows locks the jars, and swapping mods under live players would break their connection anyway)
def serverDir = file("../Serverfiles")
def serverRunning = {
	try {
		new Socket("localhost", 25565).withCloseable { true }
	} catch (IOException ignored) {
		false
	}
}
tasks.register("serverMods", Sync) {
	onlyIf {
		if (!serverDir.isDirectory()) {
			return false
		}
		if (serverRunning()) {
			logger.warn("The server is running: its mods were NOT updated. Stop it, then run Build Modpack again.")
			return false
		}
		true
	}
	from configurations.packJars
	from tasks.named("jar")
	from kitchenJar
	from mcaJar
	from kingdomsJar
	from trmtJar
	from localPackJars
	into new File(serverDir, "mods")
}
// the user's own CurseForge profile (imported from the pack zip): swap in the new Jaymo's Powers jar, the current
// Jaymo's Kitchen jar and the local pack mods (each replacing older versions of itself). Skipped while the game is
// running (its jars are locked).
def profileMods = new File(System.getProperty("user.home"), "curseforge/minecraft/Instances/Jaymo's Powers/mods")
tasks.register("profileMods") {
	dependsOn "jar", "buildKingdoms", "buildTrmt"
	onlyIf { profileMods.isDirectory() }
	doLast {
		def wanted = [[jar: tasks.named("jar").get().archiveFile.get().asFile, prefix: "jaymos-powers-"]]
		kitchenJar.files.each { wanted << [jar: it, prefix: "jaymos-kitchen-"] }
		mcaJar.files.each { wanted << [jar: it, prefix: "mca-fabric-"] }
		kingdomsJar.files.each { wanted << [jar: it, prefix: "jaymos-kingdoms-"] }
		trmtJar.files.each { wanted << [jar: it, prefix: "trmt-"] }
		localPackMods.each { wanted << [jar: file(it.file), prefix: it.prefix] }
		def old = profileMods.listFiles().findAll { f -> f.name.endsWith(".jar") && wanted.any { w -> f.name.startsWith(w.prefix) && f.name != w.jar.name } }
		if (old.any { !it.renameTo(new File(it.path + ".old")) }) {
			logger.warn("Minecraft is running: your CurseForge profile was NOT updated. Close the game, then run Build Modpack again.")
			old.each { new File(it.path + ".old").renameTo(it) }
			return
		}
		old.each { new File(it.path + ".old").delete() }
		// mods that have left the pack leave the profile too
		def removedDir = new File(profileMods.parentFile, "removed-mods")
		profileMods.listFiles().findAll { f -> f.name.endsWith(".jar") && (removedFromProfile.any { f.name.startsWith(it) } || modId(f) in removedIdsFromProfile) }.each { f ->
			removedDir.mkdirs()
			if (f.renameTo(new File(removedDir, f.name))) {
				logger.lifecycle("Moved ${f.name} out of your CurseForge profile (into removed-mods)")
			}
		}
		// pack mods newer than the profile's copy replace it (0.15.14: the profile kept Cloth Config 26.3.158, and
		// WeaponMod 1.25.2 crashed the client asking for 26.3.159). Never downgrade: CurseForge often has newer files
		// than the pack's Modrinth deps.
		def versionParts = { String v -> v.split(/[+\-]/)[0].findAll(/\d+/).collect { it as long } }
		def isNewer = { String a, String b ->
			def x = versionParts(a), y = versionParts(b)
			for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
				def c = (i < x.size() ? x[i] : 0L) <=> (i < y.size() ? y[i] : 0L)
				if (c != 0) return c > 0
			}
			false
		}
		def packById = configurations.packJars.files.collectEntries { jar -> [(modId(jar)): jar] }.findAll { it.key != null }
		profileMods.listFiles().findAll { it.name.endsWith(".jar") }.each { f ->
			def json = modJson(f)
			def jar = json == null ? null : packById[json.id]
			if (jar == null || !isNewer(modJson(jar).version as String, json.version as String)) return
			def stale = new File(f.path + ".old")
			if (!f.renameTo(stale)) {
				logger.warn("Couldn't update ${f.name} in your CurseForge profile (is Minecraft running?). Close the game, then run Build Modpack again.")
				return
			}
			java.nio.file.Files.copy(jar.toPath(), new File(profileMods, jar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			stale.delete()
			logger.lifecycle("Updated ${f.name} (${json.version}) to ${jar.name} (${modJson(jar).version}) in your CurseForge profile")
		}
		// mods that joined the pack join the profile too (any pack mod whose id the profile doesn't have yet)
		def have = profileMods.listFiles().findAll { it.name.endsWith(".jar") }.collect { modId(it) } as Set
		configurations.packJars.files.each { jar ->
			def id = modId(jar)
			if (id != null && !have.contains(id)) {
				java.nio.file.Files.copy(jar.toPath(), new File(profileMods, jar.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				have << id
				logger.lifecycle("Added ${jar.name} to your CurseForge profile")
			}
		}
		// resource packs and shader packs that joined the pack join the profile too (from CurseForge's CDN, as the
		// import would)
		def profilePacks = new File(profileMods.parentFile, "resourcepacks")
		def profileShaders = new File(profileMods.parentFile, "shaderpacks")
		(packResourcePacks.collect { [p: it, dir: profilePacks] } + packShaderPacks.collect { [p: it, dir: profileShaders] }).each { entry ->
			def p = entry.p
			def target = new File(entry.dir, p.file)
			if (!target.exists()) {
				def id = p.cf[1] as String
				def url = "https://mediafilez.forgecdn.net/files/${id.substring(0, 4)}/${id.substring(4).replaceFirst(/^0+(?=.)/, "")}/${URLEncoder.encode(p.file, "UTF-8").replace("+", "%20")}"
				try {
					entry.dir.mkdirs()
					URI.create(url).toURL().withInputStream { java.nio.file.Files.copy(it, target.toPath()) }
					logger.lifecycle("Added ${p.file} to your CurseForge profile's ${entry.dir.name}")
				} catch (IOException e) {
					target.delete()
					logger.warn("Couldn't download ${p.file} (${e.message}); get it from CurseForge project ${p.cf[0]}")
				}
			}
		}
		wanted.each { w ->
			def target = new File(profileMods, w.jar.name)
			// only when it actually changed (a rebuild of the same version too); the running game locks its jars
			if (!target.exists() || java.nio.file.Files.mismatch(target.toPath(), w.jar.toPath()) != -1L) {
				try {
					java.nio.file.Files.copy(w.jar.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
					logger.lifecycle("Updated your CurseForge profile with ${w.jar.name}")
				} catch (java.nio.file.FileSystemException e) {
					logger.warn("Minecraft is running: ${w.jar.name} in your CurseForge profile was NOT updated. Close the game, then run Build Modpack again.")
				}
			}
		}
	}
}
// the server now runs on the user's Steam Deck (deck/README.md): a fresh mods folder to download there on each release
tasks.register("deckMods", Tar) {
	dependsOn "modpackMods"
	archiveFileName = "Deck-mods-${project.version}.tar.gz"
	compression = Compression.GZIP
	destinationDirectory = packDir
	from(new File(packDir, "mods")) { into "mods" }
}
tasks.register("packageModpack") {
	group = "build"
	dependsOn "modpackMods", "curseforgePack", "serverMods", "profileMods", "deckMods"
}

// each power keeps its own lang file in lang/parts/<power>.json; they're merged into en_us.json here
def langParts = file("src/main/resources/assets/jaymospowers/lang/parts")
processResources {
	def version = project.version
	inputs.property "version", version
	inputs.dir langParts
	filesMatching("fabric.mod.json") { expand "version": version }
	exclude "assets/jaymospowers/lang/parts/**"
	doLast {
		def merged = new TreeMap()
		langParts.listFiles().findAll { it.name.endsWith(".json") }.sort { it.name }.each { part ->
			def entries = new JsonSlurper().parse(part, "UTF-8")
			entries.each { k, v ->
				if (merged.containsKey(k) && merged[k] != v) {
					throw new GradleException("lang key ${k} is defined twice (again in ${part.name})")
				}
				merged[k] = v
			}
		}
		def out = new File(destinationDir, "assets/jaymospowers/lang/en_us.json")
		out.parentFile.mkdirs()
		out.setText(JsonOutput.prettyPrint(JsonOutput.toJson(merged)), "UTF-8")
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = "UTF-8" }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
