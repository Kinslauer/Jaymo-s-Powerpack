import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive (its syncing locks files and breaks rebuilds);
// one folder per checkout, so parallel worktrees don't share a build dir
if (file("E:/").exists()) {
	layout.buildDirectory = file("E:/jaymospowers-build/${rootDir.name.replace(' ', '-')}")
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jaymospowers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		server { vmArg "-Xmx1536M" }
	}
}

// The rest of the modpack, with each mod's CurseForge [project id, file id] for the CurseForge import zip.
// Keep the versions in step with the CurseForge files (Cloth Config's newest Fabric file there is 26.3.158).
