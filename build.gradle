plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// build output lives outside OneDrive: its syncing locks files and breaks rebuilds
layout.buildDirectory = file("E:/jaymos-kingdoms-build")

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"jaymoskingdoms" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Epic Structures: Villages (all rights reserved; "feel free to add to any modpack"): its sprawling towns are where
	// kingdoms rise in the pack. Only loaded in the dev game, to found kingdoms in them.
	localRuntime "maven.modrinth:epic-structures-villages:hCRa4eFr"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
