// not on CurseForge: shipped inside the pack as overrides
// The Kitchen jar in libs/: the one matching the Kitchen source (kitchen/gradle.properties), else the newest. A git pull on
// Windows can leave an old one behind if the game or Gradle had it open; extra jars are ignored with a warning (two would
// both be compiled against and shipped under one mod id), so delete them when you see it.
def kitchenCandidates = fileTree("libs") { include "jaymos-kitchen-*.jar" }.files.sort { it.name }
if (kitchenCandidates.isEmpty()) {
	throw new GradleException("libs/ holds no jaymos-kitchen-*.jar: build kitchen/ and copy its jar into libs/.")
}
def kitchenSourceProps = new Properties()
file("kitchen/gradle.properties").withInputStream { kitchenSourceProps.load(it) }
def kitchenWanted = "jaymos-kitchen-${kitchenSourceProps.version}.jar".toString()
def kitchenVersion = { File f -> (f.name - "jaymos-kitchen-" - ".jar").findAll(/\d+/).collect { it as long } }
def kitchenChosen = kitchenCandidates.find { it.name == kitchenWanted } ?: kitchenCandidates.max { a, b ->
	def x = kitchenVersion(a), y = kitchenVersion(b)
	for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
		def c = (i < x.size() ? x[i] : 0L) <=> (i < y.size() ? y[i] : 0L)
		if (c != 0) return c
	}
	0
}
if (kitchenCandidates.size() > 1) {
	logger.warn("WARNING: libs/ holds ${kitchenCandidates.collect { it.name }}; using ${kitchenChosen.name}. " +
		"Delete the others.")
}
if (kitchenChosen.name != kitchenWanted) {
	logger.warn("WARNING: libs/${kitchenChosen.name} is not the Kitchen source's version " +
		"(${kitchenSourceProps.version}). Build kitchen/ and replace the jar in libs/.")
}
def kitchenJar = files(kitchenChosen)
// (0.20.78) What the pack ships is Kitchen built from kitchen/ at its source version, like Kingdoms, never the jar in libs/
// (that one is only compiled against and run in the dev game). libs/ held Kitchen 0.5.57 while kitchen/ was at 0.5.68, so a
// pack built without swapping it by hand shipped a Kitchen without the Other World's no-bodies rule (0.5.61): player bodies
// still rose there as zombies.
tasks.register("buildKitchen", GradleBuild) {
	dir = file("kitchen")
	tasks = ["build"]
}
def kitchenLibs = file(file("E:/").exists() ? "E:/jaymos-kitchen-build/libs" : "kitchen/build/libs")
def kitchenShipJar = fileTree(kitchenLibs) { include kitchenWanted }.builtBy("buildKitchen")
